# ─────────────────────────────────────────────────────────────────────────────
# project.yml — Hermes Digital App Template
# Gerado por xcodegen. O .xcodeproj é descartável — nunca commitar.
#
# COMO USAR:
#   1. Copiar este arquivo para a pasta raiz do novo app
#   2. Substituir as 4 variáveis marcadas com ← EDITAR
#   3. Comentar/descomentar sections opcionais conforme o app
#   4. xcodegen generate
#
# VARIÁVEIS A EDITAR (buscar por "← EDITAR"):
#   APP_SLUG        ex: waterremover
#   APP_DISPLAY_NAME   ex: Water Remover Pro
#   HAS_ADS         comentar/descomentar a dependência GoogleMobileAds
#   HAS_IPAD        ajustar TARGETED_DEVICE_FAMILY e knownRegions se iPad
# ─────────────────────────────────────────────────────────────────────────────

name: HeilpraktikerPrep                                  # ← EDITAR: mesmo que a pasta do target

options:
  bundleIdPrefix: app.hermesdigital
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  xcodeVersion: "16"

  # ── Idiomas declarados ────────────────────────────────────────────────────
  # REGRA: só declarar lprojs que existem fisicamente na pasta do app.
  # Declarar idioma sem o .lproj correspondente = rejeição ASC.
  # Começar apenas com en. Adicionar os demais conforme as traduções forem criadas.
  knownRegions:
    - Base
    - de
    # - en        # adicionar quando en.lproj existir
    # - pt-BR     # adicionar quando pt-BR.lproj existir
    # - es        # adicionar quando es.lproj existir
    # - zh-Hans
    # - ja
    # - fr
    # - ko
    # - ru
    # - it
    # - nl
    # - tr
    # - ar
    # - hi
    # - id

# ─── Configurações de build ───────────────────────────────────────────────────
configs:
  Debug: debug
  Release: release

# ─── Packages SPM ─────────────────────────────────────────────────────────────
packages:
  # Animação de confetti de boas-vindas na Home (1x, após o onboarding).
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: 4.5.0
  # HermesShared re-entra na Fase 4 (IAP). Bloqueado por bug upstream:
  # HapticsService.swift estende View sem `import SwiftUI` → pacote não compila.
  # Fix de 1 linha precisa ser commitado/tagueado (1.2.1) no repo hermes-shared por Gio.
  # HermesShared:
  #   url: https://github.com/hermesdigitalbr/hermes-shared
  #   from: 1.2.1

  # ── Descomentar se o app tiver anúncios (AdsService) ─────────────────────
  # GoogleMobileAds:
  #   url: https://github.com/googleads/swift-package-manager-google-mobile-ads
  #   from: 11.0.0

# ─── Settings globais ─────────────────────────────────────────────────────────
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: app.hermesdigital.hp

    # Display name — o que aparece embaixo do ícone no iPhone
    INFOPLIST_KEY_CFBundleDisplayName: "HP Übungstest"  # ← EDITAR

    # Orientação — portrait-only para 90% dos apps Hermes
    # Para landscape (jogos), trocar para UIInterfaceOrientationLandscapeLeft
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
      UIInterfaceOrientationPortrait
      UIInterfaceOrientationPortraitUpsideDown
      UIInterfaceOrientationLandscapeLeft
      UIInterfaceOrientationLandscapeRight

    # Universal: iPhone + iPad
    TARGETED_DEVICE_FAMILY: "1,2"

    # Launch screen gerado automaticamente (sem LaunchScreen.storyboard)
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

    # Criptografia — false para 99% dos apps (não usam crypto própria)
    ITSAppUsesNonExemptEncryption: false

    # Acessibilidade — respeitar configurações do sistema
    INFOPLIST_KEY_UISupportsDocumentBrowser: NO

  configs:
    Debug:
      PRODUCT_BUNDLE_IDENTIFIER: app.hermesdigital.hp.debug
      OTHER_SWIFT_FLAGS: "-DDEBUG"
    Release:
      PRODUCT_BUNDLE_IDENTIFIER: app.hermesdigital.hp

# ─── Schemes ──────────────────────────────────────────────────────────────────
schemes:
  HeilpraktikerPrep:
    build:
      targets:
        HeilpraktikerPrep: all
        HeilpraktikerPrepTests: [test]
    run:
      config: Debug
      storeKitConfiguration: HeilpraktikerPrep/HeilpraktikerPrep.storekit
    test:
      config: Debug
      targets:
        - HeilpraktikerPrepTests

# ─── Targets ──────────────────────────────────────────────────────────────────
targets:

  # ── App principal ──────────────────────────────────────────────────────────
  HeilpraktikerPrep:                                     # ← EDITAR: trocar HeilpraktikerPrep
    type: application
    platform: iOS

    # Universal: iPhone + iPad
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"

    sources:
      - path: HeilpraktikerPrep                          # ← EDITAR: trocar HeilpraktikerPrep
        excludes:
          - "**/*.md"
          - "**/Previews/**"
          - "**/*.storekit"   # só para o scheme — nunca embarcar no bundle

    # ── Resources incluídos automaticamente ────────────────────────────────
    # Tudo dentro de HeilpraktikerPrep/ com estas extensões é incluído:
    # .xcassets, .xcstrings, .xcprivacy, .json, .ttf, .otf, .mp3, .mp4, .lottie

    info:
      path: HeilpraktikerPrep/Info.plist                 # ← EDITAR: trocar HeilpraktikerPrep
      properties:
        # Obrigatório para aprovação Apple — nunca remover
        ITSAppUsesNonExemptEncryption: false

        # Versão/build vêm das build settings (project.yml settings.base).
        # Sem isto o xcodegen grava CFBundleVersion "1" literal no Info.plist.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"

        # Com Info.plist customizado os INFOPLIST_KEY_* do xcodegen são
        # IGNORADOS — declarar aqui. Sem UILaunchScreen o iOS letterboxa o app.
        UILaunchScreen: {}
        CFBundleDisplayName: "HP Übungstest"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # Fontes customizadas — descomentar e listar se o app usar
        # UIAppFonts:
        #   - NomeDaFonte-Regular.ttf
        #   - NomeDaFonte-Bold.ttf

        # App Transport Security — necessário apenas se o app acessa HTTP (raro)
        # NSAppTransportSecurity:
        #   NSAllowsArbitraryLoads: false

    # ── Capabilities ───────────────────────────────────────────────────────
    # NOTA: In-App Purchase NÃO precisa de entitlement. O antigo
    # "com.apple.developer.in-app-payments" é APPLE PAY (merchant.*) e quebra
    # o signing em device real. Manter entitlements vazio até precisar de
    # capability de verdade (push, sign-in with apple, icloud...).
    entitlements:
      path: HeilpraktikerPrep/HeilpraktikerPrep.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.app.hermesdigital.hp

        # ── Descomentar conforme necessário ──────────────────────────────
        # Push Notifications
        # aps-environment: development   # mudar para "production" em release

        # Sign In with Apple
        # com.apple.developer.applesignin: ["Default"]

        # iCloud (se sincronizar dados)
        # com.apple.developer.icloud-services: ["CloudKit"]
        # com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)

        # Associated Domains (Universal Links)
        # com.apple.developer.associated-domains:
        #   - applinks:hermesdigital.app

    # ── Dependências ───────────────────────────────────────────────────────
    dependencies:
      - target: HeilpraktikerPrepWidget          # embeds the widget extension
      - package: Lottie
        product: Lottie
      # HermesShared volta na Fase 4 (ver nota em packages:)
      # - package: HermesShared
      #   product: HermesShared

    # ── Settings do target ─────────────────────────────────────────────────
    settings:
      base:
        # Team ID Hermes Digital
        DEVELOPMENT_TEAM: RQFN2YXCJ5
        PRODUCT_NAME: HeilpraktikerPrep

        # Code signing
        CODE_SIGN_STYLE: Automatic

        # Compilador — warnings como erros em Release para pegar problemas cedo
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO   # mudar para YES quando o projeto estiver estável

        # Otimizações
        SWIFT_OPTIMIZATION_LEVEL[config=Release]: "-O"
        SWIFT_OPTIMIZATION_LEVEL[config=Debug]: "-Onone"

        # Debug info
        DEBUG_INFORMATION_FORMAT[config=Release]: "dwarf-with-dsym"
        DEBUG_INFORMATION_FORMAT[config=Debug]: dwarf

        # Bitcode desabilitado (Apple descontinuou)
        ENABLE_BITCODE: NO

        # Arm64 only (sem Rosetta, sem simulador 32bit)
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: ""

  # ── Widget extension (home + lock screen) ──────────────────────────────────
  HeilpraktikerPrepWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HeilpraktikerPrepWidget
      - path: HeilpraktikerPrep/Shared/WidgetSnapshot.swift   # shared with the app target
    info:
      path: HeilpraktikerPrepWidget/Info.plist
      properties:
        CFBundleDisplayName: HP Übungstest
        # Deve bater com a versão/build do app host.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HeilpraktikerPrepWidget/HeilpraktikerPrepWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.hermesdigital.hp
    settings:
      base:
        DEVELOPMENT_TEAM: RQFN2YXCJ5
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: HP Übungstest
        ENABLE_BITCODE: NO
        SWIFT_VERSION: "5.10"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.hermesdigital.hp.debug.widget
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.hermesdigital.hp.widget

  # ── Unit Tests ─────────────────────────────────────────────────────────────
  HeilpraktikerPrepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeilpraktikerPrepTests
    dependencies:
      - target: HeilpraktikerPrep
    settings:
      base:
        DEVELOPMENT_TEAM: RQFN2YXCJ5
        GENERATE_INFOPLIST_FILE: YES

  # ── UI Tests (opcional — descomentar se necessário) ────────────────────────
  # HeilpraktikerPrepUITests:
  #   type: bundle.ui-testing
  #   platform: iOS
  #   sources:
  #     - path: HeilpraktikerPrepUITests
  #   dependencies:
  #     - target: HeilpraktikerPrep
  #   settings:
  #     base:
  #       DEVELOPMENT_TEAM: RQFN2YXCJ5
